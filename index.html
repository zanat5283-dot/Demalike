<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Demalike Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #1e3a8a; --accent: #facc15; --bg: #f8fafc; --text: #0f172a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); margin: 0; color: var(--text); }

        header { background: var(--primary); padding: 25px 15px; text-align: center; border-radius: 0 0 25px 25px; }
        .logo-text { font-weight: 900; font-size: 1.6rem; color: #fff; text-transform: uppercase; letter-spacing: 1px; }

        nav { display: flex; justify-content: center; gap: 8px; padding: 15px; position: sticky; top: 0; z-index: 1000; background: rgba(248, 250, 252, 0.9); backdrop-filter: blur(10px); }
        nav button { background: white; color: var(--primary); border: 2px solid var(--primary); padding: 8px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        nav button.active { background: var(--primary); color: white; }

        .container { max-width: 450px; margin: 0 auto; padding: 10px 15px; }
        .page { display: none; }
        .page.active { display: block; }

        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h2 { color: var(--primary); text-align: center; font-size: 1.2rem; font-weight: 800; }

        input, select, textarea { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 1rem; font-family: inherit; outline: none; }

        /* ИСПРАВЛЕННЫЙ БЛОК ВЫБОРА КУРСОВ */
        .course-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .course-chip {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 5px;
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .course-chip input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .course-chip span {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* Стиль когда выбрано */
        .course-chip.active {
            background: #eff6ff;
            border-color: var(--primary);
        }
        
        .course-chip.active span {
            color: var(--primary);
        }

        .btn { width: 100%; padding: 16px; border-radius: 15px; border: none; font-weight: 800; font-size: 0.85rem; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: var(--primary); }

        .child-form { border: 2px dashed #e2e8f0; padding: 15px; border-radius: 15px; margin-bottom: 15px; position: relative; }
        
        .subject-card { background: white; border-radius: 15px; padding: 15px; margin-top: 10px; border-left: 5px solid var(--accent); box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .grade-badge { background: var(--primary); color: white; padding: 4px 10px; border-radius: 8px; font-weight: 700; margin-right: 5px; display: inline-block; margin-top: 5px; }
        .hw-box { background: #fffbeb; border-radius: 8px; padding: 10px; margin-top: 10px; font-size: 0.8rem; border: 1px solid #fef3c7; }
    </style>
</head>
<body>

<header><div class="logo-text">Demalike Center</div></header>

<nav>
    <button onclick="showPage('home')" id="btn-home" class="active">Запись</button>
    <button onclick="showPage('parent')" id="btn-parent">Дневник</button>
    <button onclick="showPage('teacher')" id="btn-teacher">Учитель</button>
</nav>

<div class="container">

    <div id="home" class="page active">
        <div class="card">
            <h2>Регистрация</h2>
            <input type="text" id="parentName" placeholder="ФИО Родителя">
            <input type="tel" id="parentPhone" placeholder="Номер телефона">
            <div id="childrenFields"></div>
            <button class="btn" style="background:#e2e8f0; color:var(--primary)" onclick="addChildForm()">+ Добавить ребенка</button>
            <button class="btn btn-accent" onclick="submitRegistration()">Зарегистрироваться</button>
        </div>
    </div>

    <div id="parent" class="page">
        <div class="card">
            <h2>Личный кабинет</h2>
            <input type="tel" id="loginPhone" placeholder="Номер телефона">
            <button class="btn btn-primary" onclick="accessParentCabinet()">Войти</button>
        </div>
        <div id="parentResults"></div>
    </div>

    <div id="teacher" class="page">
        <div class="card" id="authSection">
            <h2>Вход</h2>
            <select id="teacherRole">
                <option value="" disabled selected>Выберите предмет</option>
                <option value="Продленка">Продленка</option>
                <option value="Робототехника">Робототехника</option>
                <option value="English">English</option>
                <option value="Подготовка">Подготовка</option>
            </select>
            <input type="password" id="pass" placeholder="Пароль">
            <button class="btn btn-primary" onclick="checkAuth()">Войти</button>
        </div>
        <div id="adminPanel" style="display:none;">
            <div id="currentTeacherTitle" style="text-align:center; font-weight:bold; margin-bottom:10px;"></div>
            <div id="allStudents"></div>
            <button class="btn" onclick="location.reload()">Выйти</button>
        </div>
    </div>

</div>

<script>
    const dbName = 'demalike_v4';
    const getDB = () => JSON.parse(localStorage.getItem(dbName) || '[]');
    const saveDB = (data) => localStorage.setItem(dbName, JSON.stringify(data));
    let activeRole = "";

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('btn-' + id).classList.add('active');
    }

    // Добавление формы ребенка с исправленными кнопками курсов
    function addChildForm() {
        const div = document.createElement('div');
        div.className = 'child-form';
        div.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:10px">
                <small><b>Ребенок</b></small>
                <span style="color:red; font-weight:bold; cursor:pointer" onclick="this.parentElement.parentElement.remove()">✕</span>
            </div>
            <input type="text" class="c-name" placeholder="Имя и фамилия">
            <div class="course-selection">
                <label class="course-chip"><input type="checkbox" value="Продленка" onchange="toggleChip(this)"><span>Продленка</span></label>
                <label class="course-chip"><input type="checkbox" value="Робототехника" onchange="toggleChip(this)"><span>Роботы</span></label>
                <label class="course-chip"><input type="checkbox" value="English" onchange="toggleChip(this)"><span>English</span></label>
                <label class="course-chip"><input type="checkbox" value="Подготовка" onchange="toggleChip(this)"><span>Подготовка</span></label>
            </div>
        `;
        document.getElementById('childrenFields').appendChild(div);
    }

    // Функция для визуального выделения выбранного курса
    function toggleChip(el) {
        if(el.checked) el.parentElement.classList.add('active');
        else el.parentElement.classList.remove('active');
    }

    function submitRegistration() {
        const phone = document.getElementById('parentPhone').value;
        const cards = document.querySelectorAll('.child-form');
        if (!phone || !cards.length) return alert("Заполните форму");

        const db = getDB();
        cards.forEach(c => {
            const name = c.querySelector('.c-name').value;
            const courses = Array.from(c.querySelectorAll('input:checked')).map(i => i.value);
            if (name && courses.length) {
                db.push({ id: Date.now()+Math.random(), parentPhone: phone, childName: name, courses, grades: {}, homework: {}, videoUrl: {} });
            }
        });
        saveDB(db);
        alert("Готово!");
        location.reload();
    }

    function accessParentCabinet() {
        const phone = document.getElementById('loginPhone').value;
        const users = getDB().filter(u => u.parentPhone === phone);
        const container = document.getElementById('parentResults');
        container.innerHTML = "";
        if (!users.length) return alert("Не найдено");

        users.forEach(u => {
            let html = `<div class="card"><h3>${u.childName}</h3>`;
            u.courses.forEach(c => {
                const g = u.grades[c] || [];
                const h = u.homework[c] || "Нет задания";
                const v = u.videoUrl[c] ? `<a href="${u.videoUrl[c]}" target="_blank" class="btn" style="background:#4caf50; color:white; text-decoration:none; display:block; text-align:center">Видео отчёт</a>` : '';
                html += `
                    <div class="subject-card">
                        <div style="font-weight:900; color:var(--primary); font-size:0.8rem; margin-bottom:5px">${c}</div>
                        <div>${g.map(grade => `<span class="grade-badge">${grade}</span>`).join('')}</div>
                        <div class="hw-box"><b>ДЗ:</b> ${h}</div>
                        ${v}
                    </div>`;
            });
            html += `</div>`;
            container.innerHTML += html;
        });
    }

    function checkAuth() {
        const role = document.getElementById('teacherRole').value;
        if (role && document.getElementById('pass').value === "777") {
            activeRole = role;
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('currentTeacherTitle').innerText = "Предмет: " + role;
            loadAdminData();
        }
    }

    function loadAdminData() {
        const db = getDB();
        const container = document.getElementById('allStudents');
        container.innerHTML = "";
        db.filter(s => s.courses.includes(activeRole)).forEach(s => {
            container.innerHTML += `
                <div class="card">
                    <div style="display:flex; justify-content:space-between"><b>${s.childName}</b> <span style="color:red" onclick="del(${s.id})">Удалить</span></div>
                    <div style="display:flex; gap:5px; margin-top:10px">
                        <input type="text" id="g-${s.id}" placeholder="Оценка" style="margin:0">
                        <button class="btn btn-primary" style="width:60px; margin:0" onclick="addG(${s.id})">ОК</button>
                    </div>
                    <textarea id="h-${s.id}" placeholder="Домашнее задание">${s.homework[activeRole] || ""}</textarea>
                    <input type="text" id="v-${s.id}" placeholder="Ссылка на видео" value="${s.videoUrl[activeRole] || ""}">
                    <button class="btn btn-accent" onclick="save(${s.id})">Сохранить</button>
                </div>`;
        });
    }

    function addG(id) {
        const db = getDB();
        const i = db.findIndex(s => s.id == id);
        const val = document.getElementById('g-'+id).value;
        if (!db[i].grades[activeRole]) db[i].grades[activeRole] = [];
        db[i].grades[activeRole].push(val);
        saveDB(db); loadAdminData();
    }

    function save(id) {
        const db = getDB();
        const i = db.findIndex(s => s.id == id);
        db[i].homework[activeRole] = document.getElementById('h-'+id).value;
        db[i].videoUrl[activeRole] = document.getElementById('v-'+id).value;
        saveDB(db); alert("Сохранено");
    }

    function del(id) {
        if(confirm("Удалить?")) {
            saveDB(getDB().filter(s => s.id != id));
            loadAdminData();
        }
    }

    window.onload = addChildForm;
</script>
</body>
</html>
