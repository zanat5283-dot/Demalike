<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Demalike Center | Edu System</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a; /* Глубокий синий из Инстаграм */
            --accent: #facc15;  /* Фирменный желтый */
            --orange: #f97316;
            --red: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            margin: 0;
            color: var(--text);
            line-height: 1.5;
        }

        /* ШАПКА В СТИЛЕ БРЕНДА */
        header {
            background: var(--primary);
            padding: 30px 15px;
            text-align: center;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 10px 25px rgba(30, 58, 138, 0.2);
        }

        .logo-text {
            font-weight: 900;
            font-size: 1.8rem;
            color: #ffffff;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo-dot { color: var(--accent); }

        /* НАВИГАЦИЯ (Instagram Style) */
        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(248, 250, 252, 0.8);
            backdrop-filter: blur(10px);
        }

        nav button {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 10px 15px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        nav button.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 5px 15px rgba(30, 58, 138, 0.3);
        }

        .container { max-width: 500px; margin: 0 auto; padding: 10px 15px 50px; }

        .page { display: none; animation: slideUp 0.4s ease-out; }
        .page.active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* КАРТОЧКИ */
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            margin-bottom: 20px;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        h2 {
            color: var(--primary);
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 20px;
            font-weight: 800;
        }

        /* ПОЛЯ ВВОДА */
        input, select, textarea {
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            border-radius: 15px;
            border: 2px solid #e2e8f0;
            font-size: 1rem;
            font-family: inherit;
            transition: 0.3s;
            outline: none;
        }

        input:focus { border-color: var(--primary); background: #f0f7ff; }

        /* КНОПКИ */
        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 18px;
            border: none;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:active { transform: scale(0.98); }

        .btn-accent { background: var(--accent); color: var(--primary); }

        .btn-video {
            background: #ecfdf5;
            color: #059669;
            border: 1px solid #10b981;
            margin-top: 15px;
            font-size: 0.8rem;
        }

        /* БЛОКИ ПРЕДМЕТОВ */
        .subject-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            margin-top: 15px;
            border-left: 8px solid var(--accent);
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }

        .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .subject-name { font-weight: 800; color: var(--primary); text-transform: uppercase; font-size: 0.9rem; }

        .badge {
            background: var(--primary);
            color: white;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            margin: 3px;
            display: inline-block;
        }

        .hw-container {
            background: #fffbeb;
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            font-size: 0.85rem;
            color: #92400e;
            border: 1px dashed var(--accent);
        }

        .teacher-badge {
            background: #eef2ff;
            color: var(--primary);
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }

        .del-btn { color: var(--red); font-weight: 700; font-size: 0.7rem; cursor: pointer; opacity: 0.6; }

    </style>
</head>
<body>

<header>
    <div class="logo-text">Demalike<span class="logo-dot">.</span>Center</div>
</header>

<nav>
    <button onclick="showPage('home')" id="btn-home" class="active">Запись</button>
    <button onclick="showPage('parent')" id="btn-parent">Дневник</button>
    <button onclick="showPage('teacher')" id="btn-teacher">Учитель</button>
</nav>

<div class="container">

    <div id="home" class="page active">
        <div class="card">
            <h2>Регистрация</h2>
            <input type="text" id="parentName" placeholder="ФИО Родителя">
            <input type="tel" id="parentPhone" placeholder="Номер телефона">
            <div id="childrenFields"></div>
            <button class="btn" style="background:#f1f5f9; color:var(--primary); margin-bottom:10px" onclick="addChildForm()">+ Добавить ребенка</button>
            <button class="btn btn-accent" onclick="submitRegistration()">Зарегистрироваться</button>
        </div>
    </div>

    <div id="parent" class="page">
        <div class="card">
            <h2>Мой кабинет</h2>
            <input type="tel" id="loginPhone" placeholder="Введите номер телефона">
            <button class="btn btn-primary" onclick="accessParentCabinet()">Показать успехи</button>
        </div>
        <div id="parentResults"></div>
    </div>

    <div id="teacher" class="page">
        <div class="card" id="authSection">
            <h2>Вход для профи</h2>
            <select id="teacherRole">
                <option value="" disabled selected>Выберите ваш курс</option>
                <option value="Продленка">Продленка</option>
                <option value="Робототехника">Робототехника</option>
                <option value="English">English Space</option>
                <option value="Подготовка">Подготовка к школе</option>
            </select>
            <input type="password" id="pass" placeholder="Пароль">
            <button class="btn btn-primary" onclick="checkAuth()">Войти в систему</button>
        </div>

        <div id="adminPanel" style="display:none;">
            <div id="currentTeacherTitle" class="teacher-badge"></div>
            <div id="allStudents"></div>
            <button class="btn" style="background:none; color:var(--red); font-size:0.7rem" onclick="location.reload()">Выйти из профиля</button>
        </div>
    </div>

</div>

<script>
    const dbName = 'demalike_db_v3';
    const getDB = () => JSON.parse(localStorage.getItem(dbName) || '[]');
    const saveDB = (data) => localStorage.setItem(dbName, JSON.stringify(data));
    let activeRole = "";

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('btn-' + id).classList.add('active');
    }

    function addChildForm() {
        const div = document.createElement('div');
        div.className = 'card'; div.style = "border: 2px dashed #e2e8f0; margin-top:10px;";
        div.innerHTML = `
            <div style="display:flex; justify-content:space-between">
                <span style="font-weight:800; font-size:0.8rem">Ребенок</span>
                <span style="color:red; cursor:pointer" onclick="this.parentElement.parentElement.remove()">✕</span>
            </div>
            <input type="text" class="c-name" placeholder="Имя и фамилия">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px">
                <label style="font-size:0.7rem; display:flex; gap:5px"><input type="checkbox" value="Продленка"> Продленка</label>
                <label style="font-size:0.7rem; display:flex; gap:5px"><input type="checkbox" value="Робототехника"> Роботы</label>
                <label style="font-size:0.7rem; display:flex; gap:5px"><input type="checkbox" value="English"> English</label>
                <label style="font-size:0.7rem; display:flex; gap:5px"><input type="checkbox" value="Подготовка"> Подготовка</label>
            </div>
        `;
        document.getElementById('childrenFields').appendChild(div);
    }

    function submitRegistration() {
        const pPhone = document.getElementById('parentPhone').value;
        const childCards = document.querySelectorAll('#childrenFields .card');
        if (!pPhone || childCards.length === 0) return alert("Заполните данные!");

        const db = getDB();
        childCards.forEach(card => {
            const name = card.querySelector('.c-name').value;
            const courses = Array.from(card.querySelectorAll('input:checked')).map(c => c.value);
            if (name && courses.length > 0) {
                db.push({
                    id: Date.now() + Math.random(),
                    parentPhone: pPhone,
                    childName: name,
                    courses,
                    grades: {},
                    homework: {},
                    videoUrl: {}
                });
            }
        });
        saveDB(db);
        alert("Добро пожаловать в Demalike!");
        location.reload();
    }

    function accessParentCabinet() {
        const phone = document.getElementById('loginPhone').value;
        const results = getDB().filter(u => u.parentPhone === phone);
        const container = document.getElementById('parentResults');
        container.innerHTML = "";
        if (!results.length) return alert("Данные не найдены");

        results.forEach(s => {
            let subjectsHTML = "";
            s.courses.forEach(sub => {
                const subGrades = s.grades[sub] || [];
                const subHW = s.homework[sub] || "Заданий пока нет";
                const subVid = s.videoUrl[sub] ? `<a href="${s.videoUrl[sub]}" target="_blank" class="btn btn-video">Смотреть видео-отчет</a>` : '';

                subjectsHTML += `
                    <div class="subject-card">
                        <div class="subject-header">
                            <span class="subject-name">${sub}</span>
                        </div>
                        <div>${subGrades.map(g => `<span class="badge">${g}</span>`).join('') || '<small>Оценок нет</small>'}</div>
                        <div class="hw-container"><b>🏠 ДЗ:</b> ${subHW}</div>
                        ${subVid}
                    </div>
                `;
            });

            container.innerHTML += `
                <div class="card" style="border-top:8px solid var(--primary)">
                    <h3 style="margin:0; color:var(--primary); font-weight:900">${s.childName}</h3>
                    ${subjectsHTML}
                </div>`;
        });
    }

    function checkAuth() {
        const role = document.getElementById('teacherRole').value;
        if (!role || document.getElementById('pass').value !== "777") return alert("Доступ закрыт!");
        activeRole = role;
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('currentTeacherTitle').innerText = "📚 Профиль: " + role;
        loadAdminData();
    }

    function loadAdminData() {
        const db = getDB();
        const filtered = db.filter(s => s.courses.includes(activeRole));
        const container = document.getElementById('allStudents');
        container.innerHTML = filtered.length ? "" : "Учеников нет";

        filtered.forEach(s => {
            container.innerHTML += `
                <div class="card" style="padding:15px; margin-bottom:15px">
                    <div style="display:flex; justify-content:space-between">
                        <b style="color:var(--primary)">${s.childName}</b>
                        <span class="del-btn" onclick="delStudent(${s.id})">Удалить</span>
                    </div>
                    <div style="display:flex; gap:5px; margin:10px 0">
                        <input type="text" id="g-${s.id}" placeholder="Оценка" style="margin:0; flex:1; padding:10px">
                        <button class="btn btn-primary" style="width:60px; padding:0; border-radius:12px" onclick="addGrade(${s.id})">ОК</button>
                    </div>
                    <textarea id="h-${s.id}" placeholder="ДЗ по предмету...">${s.homework[activeRole] || ""}</textarea>
                    <input type="text" id="v-${s.id}" placeholder="Ссылка на видео" value="${s.videoUrl[activeRole] || ""}" style="font-size:0.8rem; padding:10px">
                    <button class="btn btn-accent" style="padding:12px; font-size:0.75rem" onclick="saveData(${s.id})">Обновить данные</button>
                </div>`;
        });
    }

    function addGrade(id) {
        const val = document.getElementById('g-'+id).value;
        if (!val) return;
        const db = getDB();
        const idx = db.findIndex(s => s.id == id);
        if (!db[idx].grades[activeRole]) db[idx].grades[activeRole] = [];
        db[idx].grades[activeRole].push(val);
        saveDB(db);
        loadAdminData();
    }

    function saveData(id) {
        const hw = document.getElementById('h-'+id).value;
        const vid = document.getElementById('v-'+id).value;
        const db = getDB();
        const idx = db.findIndex(s => s.id == id);
        db[idx].homework[activeRole] = hw;
        db[idx].videoUrl[activeRole] = vid;
        saveDB(db);
        alert("Данные сохранены!");
        loadAdminData();
    }

    function delStudent(id) {
        if (confirm("Удалить ученика?")) {
            const db = getDB().filter(s => s.id != id);
            saveDB(db);
            loadAdminData();
        }
    }

    window.onload = addChildForm;
</script>

</body>
</html>
